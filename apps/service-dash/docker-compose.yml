name: big-bear-service-dash

services:
  service-dash:
    image: ghcr.io/cvaghela/service-dash:1.5.5@sha256:eeb78869bcc5697269a748e0ebded4e9d16b385c1e15d8d30c8b0d5e1960249d
    container_name: service-dash
    ports:
      # Change 8888 only when a different host port is required.
      - "8888:80"
    environment:
      # User configuration: edit these values directly when defaults differ.
      KUMA_PORT: "3001"
      STATUS_SLUG: "homelab"
      # Use "auto" or an exact mount path reported by Netdata, such as "/",
      # "/DATA", "/media/1TB-SSD-1", or "/mnt/storage".
      STORAGE_MOUNT: "auto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      netdata:
        condition: service_healthy
      docker-metadata:
        condition: service_started
      network-info:
        condition: service_healthy
      kuma-auth:
        condition: service_healthy
    volumes:
      - networkinfo:/var/run/network-info:ro
      # Written by the two AI usage reporters below. Read-only here: the
      # dashboard serves the document, it never writes it.
      - aiusage:/var/run/ai-usage:ro
      # Card settings, filters and notes, shared by every browser and device.
      - settings:/var/lib/service-dash
    restart: unless-stopped

  # Answers one question for nginx: is this browser really signed in to Uptime
  # Kuma? Without it, saving settings would have to trust the browser's word.
  kuma-auth:
    image: ghcr.io/cvaghela/service-dash-kuma-auth:1.5.5@sha256:696685ba323a55f316aa3b8945e67524c74cbdafe3c4c69a23b64419d03665f1
    container_name: service-dash-kuma-auth
    environment:
      # Must point at the same Uptime Kuma as KUMA_PORT above — if you change
      # one, change the other.
      KUMA_URL: "http://host.docker.internal:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:2371/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  network-info:
    image: ghcr.io/cvaghela/service-dash-network-info:1.5.5@sha256:29557d880455abc7446837c2985bf6989c9de08fa4fc0600b78ca36a55d26255
    container_name: service-dash-network-info
    network_mode: host
    read_only: true
    environment:
      # Starting value only — the dashboard's settings page overrides it.
      NETWORK_INFO_REFRESH_SECONDS: "600"
    volumes:
      - networkinfo:/status
      # Read-only: the refresh interval is set on the dashboard's settings page.
      - settings:/settings:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-s", "/status/status.json"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  docker-metadata:
    image: ghcr.io/hectorm/cetusguard:v1@sha256:b3dc5d2042869dd714c75985d94bb8c259df53b325ec6b1a2b57bcc3eac17689
    container_name: service-dash-docker-metadata
    read_only: true
    environment:
      CETUSGUARD_BACKEND_ADDR: unix:///var/run/docker.sock
      CETUSGUARD_FRONTEND_ADDR: tcp://0.0.0.0:2375
      CETUSGUARD_RULES: |
        GET %API_PREFIX_NETWORKS%(\?.*)?
        GET %API_PREFIX_NETWORKS%/%NETWORK_ID_OR_NAME%(\?.*)?
        GET %API_PREFIX_CONTAINERS%/%CONTAINER_ID_OR_NAME%/json(\?.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable@sha256:c45c71eb23ff3f1012bcda7832bf08c0b09954363557e84511bcfaf6cafa3aa8
    container_name: service-dash-netdata
    pid: host
    environment:
      DISABLE_TELEMETRY: "1"
      # Container names only, through the CetusGuard allowlist rather than a
      # socket of its own. ":ro" on a socket mount restricts the mount, not the
      # Docker API, so it was never the safeguard it looked like.
      DOCKER_HOST: tcp://docker-metadata:2375
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  # Optional, and idle until you sign in. Reports how much of your Claude plan
  # is left, as dials above the card grid. It holds a credential and carries
  # Claude Code, so it starts for nobody by default -- signing in is what turns
  # the panel on:
  #   docker exec -it service-dash-claude-usage claude auth login
  claude-usage:
    image: ghcr.io/cvaghela/service-dash-claude-usage:1.5.5@sha256:eb32d58697486c0f0aa01b6cfa423d44c521fb59fb3b95d15f76baedbba370cd
    container_name: service-dash-claude-usage
    environment:
      # Plan windows move slowly; polling harder gains nothing.
      CLAUDE_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - aiusage:/status
      # The login. Without this a container rebuild signs you out.
      - claudeauth:/root/.claude
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The same for a ChatGPT/Codex plan. --device-auth is not optional in a
  # container: the default flow opens a browser at the container's own
  # localhost and hangs rather than failing.
  #   docker exec -it service-dash-codex-usage codex login --device-auth
  codex-usage:
    image: ghcr.io/cvaghela/service-dash-codex-usage:1.5.5@sha256:5a11eb2242567a86283fcd85d4b0e2e61b85160a565b6544f871306931cee357
    container_name: service-dash-codex-usage
    environment:
      CODEX_USAGE_REFRESH_SECONDS: "300"
    volumes:
      - aiusage:/status
      - codexauth:/root/.codex
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  aiusage:
  claudeauth:
  codexauth:
  networkinfo:
  settings:
  netdataconfig:
  netdatalib:
  netdatacache:

