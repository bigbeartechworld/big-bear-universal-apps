name: skysend

services:
  skysend:
    image: skyfay/skysend:v3.0.1@sha256:aa38fb1213fb564037b728c6a8a5d619a3223dfd3006509b79058384fe76d6fa
    container_name: skysend
    restart: unless-stopped
    ports:
      - "23001:3000"
    volumes:
      - skysend_data:/data
      - skysend_uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads

volumes:
  skysend_data:
    name: skysend_data
    driver: local
  skysend_uploads:
    name: skysend_uploads
    driver: local
