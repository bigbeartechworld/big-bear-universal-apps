name: linuxserver-grocy
services:
  app:
    image: linuxserver/grocy:4.7.1@sha256:055a930b0c556f4114408b7c145087ef362c01991446f6e20ad164d4eb4d9f0d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 9283
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
