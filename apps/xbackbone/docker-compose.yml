name: linuxserver-xbackbone
services:
  app:
    image: linuxserver/xbackbone:3.8.2@sha256:5eb683c0bbc5327a9e7cb5aea958072f6db646a0733477c52cb6532a7f858302
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
