name: linuxserver-changedetection.io
services:
  app:
    image: linuxserver/changedetection.io:0.60.10@sha256:93eb232bd7828ebe4efac81765d108f9f54ef67918ff03eb85524f847c54bc1e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/changedetection.io/config
        target: /config
