name: linuxserver-freshrss
services:
  app:
    image: linuxserver/freshrss:1.30.4@sha256:8b18490112cafc5f6e113ceeb4fe2228fb267a9700aa57ee8392da636c596a88
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
