name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.21@sha256:6bece0644e29a347e5ae17db43c36938c86f171c6f5e0cef18aa2075d331f3a3
    container_name: hermes
    restart: unless-stopped
    command:
      - gateway
      - run
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - hermes_data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: zimaos
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
    deploy:
      resources:
        reservations:
          memory: 1G

volumes:
  hermes_data:
    name: hermes_data
    driver: local
