name: linuxserver-yq
services:
  app:
    image: linuxserver/yq:4.4.4@sha256:655a34e68d0188f9ab7e977fbebe95ab5b126bf3c45ab8c076a7c2f0a3c6f57a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
