name: linuxserver-webtop
services:
  app:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:b00eb3f5f91e4837be4a8aa43112a9032d7e4947a048faaa4bd9b7c0a524e25b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
