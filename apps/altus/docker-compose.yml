name: linuxserver-altus
services:
  app:
    image: linuxserver/altus:5.8.1@sha256:cf95556423d0037117c0f9c8e7261372bbb03bb13e8715fe80b885f769c0918c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
