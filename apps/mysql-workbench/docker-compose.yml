name: linuxserver-mysql-workbench
services:
  app:
    image: linuxserver/mysql-workbench:8.0.47@sha256:7a2edc5076c1307fe5925bf4cfed4cda4a369302327822a8f7779ea5a7634006
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
