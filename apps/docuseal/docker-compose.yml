name: docuseal

services:
  docuseal:
    image: docuseal/docuseal:3.3.2@sha256:fcfa6b2dbf6d8847396f59f8af9591785c66152154337a54d1c1748b4d9366b3
    container_name: docuseal
    restart: unless-stopped
    ports:
      - "20031:3000"
    volumes:
      - docuseal_data:/data

volumes:
  docuseal_data:
    name: docuseal_data
    driver: local
