name: docuseal

services:
  docuseal:
    image: docuseal/docuseal:3.3.4@sha256:2786607f1f6eb54f982a926bd78c81ee23b6545e59d1ff548bd672094760621c
    container_name: docuseal
    restart: unless-stopped
    ports:
      - "20031:3000"
    volumes:
      - docuseal_data:/data

volumes:
  docuseal_data:
    name: docuseal_data
    driver: local
