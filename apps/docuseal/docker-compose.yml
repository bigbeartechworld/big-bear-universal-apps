name: docuseal

services:
  docuseal:
    image: docuseal/docuseal:3.3.3@sha256:28d0ca583860e2c73e5b068756023a93a325799a22da1f788355d566865dd051
    container_name: docuseal
    restart: unless-stopped
    ports:
      - "20031:3000"
    volumes:
      - docuseal_data:/data

volumes:
  docuseal_data:
    name: docuseal_data
    driver: local
