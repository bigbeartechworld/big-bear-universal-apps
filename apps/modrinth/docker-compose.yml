name: linuxserver-modrinth
services:
  app:
    image: linuxserver/modrinth:0.22.1@sha256:a45d7d289c14d407aa0dbd2d87cc81a2c402c58a72164ded8ebf3655eb289dac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
