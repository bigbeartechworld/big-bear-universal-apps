name: linuxserver-bambustudio
services:
  app:
    image: linuxserver/bambustudio:02.08.04@sha256:82552dbc2654c38f2f4ed5bc8e6fad0528357c3ab8c66a8254c10e286cbdf14e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
