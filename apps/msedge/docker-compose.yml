name: linuxserver-msedge
services:
  app:
    image: linuxserver/msedge:156.0.4314@sha256:5294adec88a4047ec9b2d7f999501f8f1c82dae4b4e7be17ba23cb7104f53fb5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
