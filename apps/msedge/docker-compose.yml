name: linuxserver-msedge
services:
  app:
    image: linuxserver/msedge:155.0.4283@sha256:92264998943ca90e3a0cfb3888d4f93666e273f620c6a06e938806f1f2c7fcf6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
