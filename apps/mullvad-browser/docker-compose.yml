name: linuxserver-mullvad-browser
services:
  app:
    image: linuxserver/mullvad-browser:16.0.20261029@sha256:abac36f3293ed7493ef3416f41336a9e834815a38d1ab45b2b7cafba75272a1d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LOCAL_NET: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mullvad-browser/config
        target: /config
      - type: bind
        source: /DATA/Downloads
        target: /config/Downloads
    cap_add:
      - NET_ADMIN
    shm_size: 1gb
