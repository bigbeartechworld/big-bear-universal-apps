name: linuxserver-grav
services:
  app:
    image: linuxserver/grav:2.2.15@sha256:1c9a7125c76f5a99e3fcd1dcc47c69048fe6febac08caa90859c70241b61fe50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
