name: linuxserver-vscodium-web
services:
  app:
    image: linuxserver/vscodium-web:1.143.17232@sha256:b0efd96949f83c92cc7119eccf2cd70001f4fdbe5e875eaea9311967128f5d55
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
