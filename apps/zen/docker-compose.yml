name: linuxserver-zen
services:
  app:
    image: linuxserver/zen:1.23.4@sha256:f4ba3a456efd63a2bfc19960804655e36f64301dbe65b306cf2865dd41aa18f0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
