name: linuxserver-webstation
services:
  app:
    image: linuxserver/webstation:0.15.3-romm@sha256:099c60ff43d03772289f7963f4c466565704eec617d036589291e5736d24a981
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
