name: linuxserver-telegram
services:
  app:
    image: linuxserver/telegram:7.3.3@sha256:0b7d0edd5045496049ace894fca617e9ae3063e5fdb24b06e074ff1dc22c68e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
