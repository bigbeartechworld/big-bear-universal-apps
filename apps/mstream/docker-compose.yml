name: linuxserver-mstream
services:
  app:
    image: linuxserver/mstream:6.32.0@sha256:cc60f6c062a896c2c72516a7658eec340df9503fe00a5afd8b4753499e424376
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mstream/config
        target: /config
      - type: bind
        source: /DATA/AppData/mstream/music
        target: /music
