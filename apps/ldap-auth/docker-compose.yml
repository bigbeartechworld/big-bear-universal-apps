name: linuxserver-ldap-auth
services:
  app:
    image: linuxserver/ldap-auth:3.4.8@sha256:5b20e150cde8404bb3fe855d7bf7c29dc13980690f58687bb90139f76b9de8ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
      - target: 8888
        published: 8888
        protocol: tcp
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
