name: linuxserver-freecad
services:
  app:
    image: linuxserver/freecad:1.1.4@sha256:958ef946d9b9a726272102b76a563063645604dd9658c6a445d31e8128e8b07f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
