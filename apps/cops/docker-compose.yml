name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.6.1@sha256:231d108d948689acb80303cf38beb1c3857d8dac5197d75e11601c16c4d240e1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
