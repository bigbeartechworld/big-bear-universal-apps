name: big-bear-cantinarr

services:
  app:
    image: ghcr.io/windoze95/cantinarr:0.15.0@sha256:29e23ca46bc78d6055434d5c83b037af991ecb38a68ee1f316fdcd41193838e7
    container_name: big-bear-cantinarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      CANTINARR_PUSH_GATEWAY_URL: https://push.cantinarr.com
      CANTINARR_ARR_CALLBACK_URL: ""
    volumes:
      - cantinarr_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8585/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - big_bear_cantinarr_network

networks:
  big_bear_cantinarr_network:
    driver: bridge

volumes:
  cantinarr_config:
    name: cantinarr_config
    driver: local
