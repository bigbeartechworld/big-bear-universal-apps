name: big-bear-cantinarr

services:
  app:
    image: ghcr.io/windoze95/cantinarr:0.3.0@sha256:d49dd64daf7f7b0c90dd56989b565783130b9ddf24603a4ec8317c55d6bd1797
    container_name: big-bear-cantinarr
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      CANTINARR_PUSH_GATEWAY_URL: https://push.julian.codes
      CANTINARR_ARR_CALLBACK_URL: ""
    volumes:
      - cantinarr_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8585/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - big_bear_cantinarr_network

networks:
  big_bear_cantinarr_network:
    driver: bridge

volumes:
  cantinarr_config:
    name: cantinarr_config
    driver: local
