name: linuxserver-helium
services:
  app:
    image: linuxserver/helium:0.20.2@sha256:6db553a1a8892da4cb5f3ed2e267db9dc3ef6b0436014c9c97cf3d6e02b6e824
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
