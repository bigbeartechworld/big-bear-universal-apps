name: linuxserver-vscodium
services:
  app:
    image: linuxserver/vscodium:1.143.17232@sha256:f3884f8fd710f6cdc90c30a3bdcc553dd76355e9678c57468a21d99deac26570
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
