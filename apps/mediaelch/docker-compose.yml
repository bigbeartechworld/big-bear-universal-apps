name: linuxserver-mediaelch
services:
  app:
    image: linuxserver/mediaelch:2.12.0@sha256:8ea3f505ec6bafdf01b3723091d916dd7b09f3db25d61f93edc396549131306d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
