name: podfetch

services:
  app:
    image: samuel19982/podfetch:v5.2.3@sha256:e2f8e6a59871cb76ce5be681f3720ba2f6ba6b8aa98031340de36606dce2c3ad
    container_name: podfetch
    ports:
      - "8000:8000"
    volumes:
      - podfetch_podcasts:/app/podcasts
      - podfetch_db:/app/db
    environment:
      - DATABASE_URL=sqlite:///app/db/podcast.db
      - POLLING_INTERVAL=300
      - BASIC_AUTH=false
      - USERNAME=bigbear
      - PASSWORD=15c40698-3cd9-40ce-8039-e8d80fc1a030
      - GPODDER_INTEGRATION_ENABLED=false
    restart: unless-stopped
    networks:
      - podfetch-network

networks:
  podfetch-network:
    driver: bridge

volumes:
  podfetch_podcasts:
    name: podfetch_podcasts
    driver: local
  podfetch_db:
    name: podfetch_db
    driver: local
