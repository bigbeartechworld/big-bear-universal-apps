name: linuxserver-github-desktop
services:
  app:
    image: linuxserver/github-desktop:3.4.13@sha256:1cefeef200801145359d18720db35e8c56fb7c52a29a6f8d8f15beef8f0fe66b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
