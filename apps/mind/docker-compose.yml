# Configuration for big-bear-mind setup
name: big-bear-mind
# Service definitions for the big-bear-mind application
services:
  app:
    image: "mrcas/mind:v1.5.1@sha256:e9d849852e23d01905c9ce5513633659a00d53e68707127c326b90de6f0f3643"
    container_name: mind
    environment:
      - TZ=UTC
    volumes:
      - "mind_db:/app/db"
    ports:
      - "8080:8080"
volumes:
  mind_db:
    name: mind_db
    driver: local
