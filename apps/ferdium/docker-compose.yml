name: linuxserver-ferdium
services:
  app:
    image: linuxserver/ferdium:7.2.3@sha256:0819d9c67e06bd88699067bdd85a8783bbe30555e8b4e079b44febf5e2fca1b5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
