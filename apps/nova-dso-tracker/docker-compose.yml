name: nova-dso-tracker
services:
  nova:
    image: mrantonsg/nova-dso-tracker:6.3.0@sha256:37429f86513364fae00baa5b406c517c033d6379c24db4ec40cbf6567a854102
    container_name: big-bear-nova-dso-tracker
    ports:
      - "5001:5001"
    volumes:
      - nova-dso-tracker_data:/app/instance
    restart: unless-stopped
    network_mode: bridge

volumes:
  nova-dso-tracker_data:
    name: nova-dso-tracker_data
    driver: local
