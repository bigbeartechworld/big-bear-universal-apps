name: nova-dso-tracker
services:
  nova:
    image: mrantonsg/nova-dso-tracker:6.7.1@sha256:33b20216f6050c4dfbf6b933dc98e0c95f86c60b529189d394c8ef312da22052
    container_name: big-bear-nova-dso-tracker
    ports:
      - "5001:5001"
    volumes:
      - nova-dso-tracker_data:/app/instance
    restart: unless-stopped
    network_mode: bridge

volumes:
  nova-dso-tracker_data:
    name: nova-dso-tracker_data
    driver: local
