name: linuxserver-blade-of-agony
services:
  app:
    image: linuxserver/blade-of-agony:3.1.20261029@sha256:4e7a93d531bdb9f9d2467084174a44363092cbbc32951538aa0967d23e82a893
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
