name: big-bear-snipe-it-v8
services:
  app:
    image: snipe/snipe-it:v8.7.2@sha256:18cc45da877ec5509e1fdb17b492db42e37d3ca3bc89d885d82e9c0ecdae1253
    restart: unless-stopped
    ports:
      - 8086:80
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: $APP_KEY
      APP_URL: $APP_URL
      APP_TIMEZONE: UTC
      APP_LOCALE: en-US
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: snipeit
      DB_USERNAME: snipeit
      DB_PASSWORD: $DB_PASSWORD
    volumes:
      - snipe-it-v8_storage:/var/lib/snipeit
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snipeit
      MYSQL_USER: snipeit
      MYSQL_PASSWORD: $DB_PASSWORD
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
    volumes:
      - snipe-it-v8_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
volumes:
  snipe-it-v8_storage:
    name: snipe-it-v8_storage
    driver: local
  snipe-it-v8_db_data:
    name: snipe-it-v8_db_data
    driver: local
