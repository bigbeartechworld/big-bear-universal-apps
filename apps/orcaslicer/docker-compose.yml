name: linuxserver-orcaslicer
services:
  app:
    image: linuxserver/orcaslicer:2.4.2@sha256:4c36056bac406aa443c633da4f2368be24e12b97cd2921c46e638e4ee5bd4f80
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
